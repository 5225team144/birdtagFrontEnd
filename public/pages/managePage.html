<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- AWS Cognito SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/amazon-cognito-identity-js/6.3.12/amazon-cognito-identity.min.js"></script>
    <title>BirdTag</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <!-- Header/Navbar-->
    <header>
        <nav class="navbar section-content">
            <a href="homePage.html" class="nav-logo">
                <img src="../images/logo2.png" alt="Logo" class="logo-image"/>
                <h2 class="logo-text">BirdTag</h2>
            </a>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="homePage.html" class="nav-link">Home</a>
                </li>

                <li class="nav-item">
                    <a href="viewPage.html" class="nav-link">View</a>
                </li>

                <li class="nav-item">
                    <a href="searchPage.html" class="nav-link">Search</a>
                </li>

                <li class="nav-item">
                    <a href="managePage.html" class="nav-link">Manage</a>
                </li>
            </ul>

            <div class="auth-section">
                <span class="welcome-message">Welcome, Bird Detectors from FIT5225 Teaching Team!!!</span>
                <a href="https://ap-southeast-2k4rcti6cd.auth.ap-southeast-2.amazoncognito.com/login?client_id=66gnv00j886spaj5na9f1km3ht&response_type=code&scope=email+openid+phone&redirect_uri=https%3A%2F%2F5225birdtags3-01.s3.ap-southeast-2.amazonaws.com%2Fstatic_frontend%2FbirdtagFrontEnd%2Fpublic%2Fpages%2FhomePage.html">
                    <button class="auth-btn logout">Logout</button>
                </a>
            </div>
        </nav>
    </header>

  <main class="managePage_container">
    <h2 class="manage-title">Manage Files</h2>

    <!-- Section 1: Bulk Tagging -->
    <section class="manage-section">
      <h2>Add or Remove Tags</h2>
      
      <div class="input-group-list" id="tag-file-url-list">
  <div class="input-group">
    <input type="text" placeholder="Enter thumbnail URL" class="tag-url-input"/>
    <button class="remove-field">Remove</button>
  </div>
</div>
<button type="button" id="add-tag-url">+ Add URL</button>

      <label for="tag-operation">Operation:</label>
      <select id="tag-operation">
        <option value="1">Add Tags</option>
        <option value="0">Remove Tags</option>
      </select>

      <div class="input-group-list" id="tag-values-list">
  <div class="input-group">
    <input type="text" placeholder="e.g. Crow,2" class="tag-value-input"/>
    <button class="remove-field">Remove</button>
  </div>
</div>
<button type="button" id="add-tag-value">+ Add Tag</button>

      <button class="manage-submit-btn"id="submit-tags-btn">Submit Tag Operation</button>
      <div id="tag-update-status" class="status-message"></div>
    </section>

    <!-- Section 2: Delete Files -->
    <section class="manage-section">
      <h2>Delete Files</h2>

      <div class="input-group-list" id="delete-file-url-list">
  <div class="input-group">
    <input type="text" placeholder="Enter file URL" class="delete-url-input"/>
    <button class="remove-field">Remove</button>
  </div>
</div>
<button type="button" id="add-delete-url">+ Add File URL</button>

      <button class="manage-submit-btn" id="delete-files-btn">Delete Files</button>
      <div id="delete-status" class="status-message"></div>
    </section>
  </main>
  <script src="../scripts/managePage.js"></script>
</body>
</html>
