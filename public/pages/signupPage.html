<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - BirdTag</title>
  <link rel="stylesheet" href="../styles/style.css" />
  <link rel="stylesheet" href="../styles/auth-styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.149.0/aws-sdk.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/amazon-cognito-identity-js/6.3.12/amazon-cognito-identity.min.js"></script>
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="../images/logo2.png" alt="BirdTag Logo" class="auth-logo"/>
        <h1>Create Account</h1>
        <p>Join BirdTag to tag, track, and tweet smarter.</p>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" name="email" required placeholder="Enter your email" />
          <span class="error-message" id="signup-email-error"></span>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" name="password" required placeholder="Create a password" />
          <span class="error-message" id="signup-password-error"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password" />
          <span class="error-message" id="confirm-password-error"></span>
        </div>

        <button type="submit" class="auth-btn primary" id="signupBtn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loading" style="display: none;">
            <i class="loading-spinner"></i> Creating...
          </span>
        </button>

        <div class="form-divider">
          <span>Already have an account?</span>
        </div>

        <button type="button" class="auth-btn secondary" onclick="goToLogin()">Back to Login</button>
      </form>

      <div class="error-banner" id="signupErrorBanner" style="display: none;">
        <span class="error-text" id="signupErrorText"></span>
        <button class="error-close" id="signupErrorClose">&times;</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="signupLoadingOverlay" style="display: none;">
    <div class="loading-content">
      <div class="loading-spinner large"></div>
      <p>Creating your account...</p>
    </div>
  </div>

  <script src="router.js"></script>
  <script src="auth-cognito.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const signupForm = document.getElementById('signupForm');
      const signupBtn = document.getElementById('signupBtn');
      const errorBanner = document.getElementById('signupErrorBanner');
      const errorText = document.getElementById('signupErrorText');
      const errorClose = document.getElementById('signupErrorClose');

      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();

        if (!email || !password || !confirmPassword) {
          showError('All fields are required.');
          return;
        }

        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }

        try {
          setLoading(true);
          hideError();
          await signUpUser(email, password);
          alert("Account created! Please check your email for a confirmation link.");
          window.birdTagRouter.navigateTo('login');
        } catch (err) {
          showError(err.message || 'Signup failed. Please try again.');
          setLoading(false);
        }
      });

      errorClose.addEventListener('click', hideError);

      function showError(message) {
        errorText.textContent = message;
        errorBanner.style.display = 'flex';
      }

      function hideError() {
        errorBanner.style.display = 'none';
      }

      function setLoading(loading) {
        const btnText = signupBtn.querySelector('.btn-text');
        const btnLoading = signupBtn.querySelector('.btn-loading');
        const overlay = document.getElementById('signupLoadingOverlay');

        if (loading) {
          btnText.style.display = 'none';
          btnLoading.style.display = 'inline-flex';
          signupBtn.disabled = true;
          overlay.style.display = 'flex';
        } else {
          btnText.style.display = 'inline';
          btnLoading.style.display = 'none';
          signupBtn.disabled = false;
          overlay.style.display = 'none';
        }
      }
    });

    function goToLogin() {
      if (window.birdTagRouter) {
        window.birdTagRouter.navigateTo('login');
      } else {
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>
