<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirdTag</title>
    <!-- AWS Cognito SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/amazon-cognito-identity-js/6.3.12/amazon-cognito-identity.min.js"></script>
    <script src="../scripts/auth.js?v=5"></script>
    <script>
        requireLogin(); // forces redirect if not logged in
    </script>
    <link rel="stylesheet" href="../styles/style.css?v=5">
</head>

<body>
    <!-- Header/Navbar-->
    <header>
        <nav class="navbar section-content">
            <a href="homePage.html" class="nav-logo">
                <img src="../images/logo2.png" alt="Logo" class="logo-image"/>
                <h2 class="logo-text">BirdTag</h2>
            </a>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="homePage.html" class="nav-link">Home</a>
                </li>
                
                <li class="nav-item">
                    <a href="viewPage.html" class="nav-link">View</a>
                </li>

                <li class="nav-item">
                    <a href="searchPage.html" class="nav-link">Search</a>
                </li>

                <li class="nav-item">
                    <a href="managePage.html" class="nav-link">Manage</a>
                </li>
            </ul>

            <div class="auth-section">
                <span class="welcome-message">Welcome, Bird Detectors from FIT5225 Teaching Team!!!</span>
                <a href="https://ap-southeast-2vbh9yejbl.auth.ap-southeast-2.amazoncognito.com/login?client_id=6s2r7m3sr0i0m35n9lqaf7ne2l&response_type=code&scope=email+openid+phone&redirect_uri=https%3A%2F%2F5225birdtags3-01.s3.ap-southeast-2.amazonaws.com%2Fstatic_frontend%2FbirdtagFrontEnd%2Fpublic2%2Fpages%2FhomePage.html">
                    <button class="auth-btn logout">Logout</button>
                </a>
            </div>

        </nav>
    </header>

    <main>
        <div class="overlay"></div>

        <!-- Hero Section -->
        <section class="hero-section">
            <div class="section-content">
                <!-- Hero Details -->
                <div class="hero-details some bs to make it look good">
                    <h2 class="title">BirdTag - AI supported image detector!</h2>
                    <h3 class="subtitle">Discover and organize bird species in your media files</h3>
                </div>

                <!-- Upload Section -->
                <div class="upload-container">
                    <div class="upload-area">
                        <!-- <input type="file" id="fileInput" class="file-input"accept="image/*,audio/*,video/*" multiple> -->

                        <label for="fileInput" class="custom-file-upload">
                        Choose a File
                        </label>
                        <input type="file" id="fileInput" accept="image/*,audio/*,video/*" multiple hidden>
                        <p class="supported-formats">Supported: Images (JPG), Audio (WAV), Video (MP4, MOV)</p>
                        <button class="upload-btn" onclick="uploadFile()">
                            UPLOAD BIRD FILES
                        </button>
                        <p class="upload-status" id="status"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="../scripts/homePageScript.js?v=5"></script>
</body>
</html>
