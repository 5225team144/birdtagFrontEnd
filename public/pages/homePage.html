<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirdTag</title>
    <!-- <script src="../scripts/homePageScript.js"></script> -->
    <script src="../scripts/navigation.js"></script>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <!-- Header/Navbar-->
    <header>
        <nav class="navbar section-content">
            <a href="homePage.html" class="nav-logo">
                <img src="../images/logo2.png" alt="Logo" class="logo-image"/>
                <h2 class="logo-text">BirdTag</h2>
            </a>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="viewPage.html" class="nav-link">View</a>
                </li>

                <li class="nav-item">
                    <a href="searchPage.html" class="nav-link">Search</a>
                </li>

                <li class="nav-item">
                    <a href="managePage.html" class="nav-link">Manage</a>
                </li>
            </ul>

            <div class="auth-section">
                    <span class="welcome-message">Welcome, User!</span>
                    <button class="auth-btn login">Login</button>
                    <button class="auth-btn logout">Logout</button>
            </div>
        </nav>
    </header>

    <main>
        <div class="overlay"></div>

        <!-- Hero Section -->
        <section class="hero-section">
            <div class="section-content">
                <!-- Hero Details -->
                <div class="hero-details some bs to make it look good">
                    <h2 class="title">BirdTag - AI supported image detector!</h2>
                    <h3 class="subtitle">Discover and organize bird species in your media files</h3>
                </div>

                <!-- Upload Section -->
                <div class="upload-container">
                    <div class="upload-area">
                        <!-- <input type="file" id="fileInput" class="file-input"accept="image/*,audio/*,video/*" multiple> -->

                        <label for="fileInput" class="custom-file-upload">
                        Choose a File
                        </label>
                        <input type="file" id="fileInput" accept="image/*,audio/*,video/*" multiple hidden>
                        <p class="supported-formats">Supported: Images (JPG), Audio (WAV), Video (MP4, MOV)</p>
                        <button class="upload-btn" onclick="uploadFile()">
                            UPLOAD BIRD FILES
                        </button>
                        <p class="upload-status" id="status"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Quick Actions Section-->
         <section class="actions-section">
            <h2 class="section-title">Quick Actions</h2>
            <div class="action-buttons">
                <a href="#" class="action-btn search-btn">
                    <span>🔍</span>
                    Search Media
                </a>
                <a href="#" class="action-btn manage-btn">
                    <span>🏷️</span>
                    Manage Tags
                </a>
                <a href="#" class="action-btn browse-btn">
                    <span>📂</span>
                    Browse Files
                </a>
            </div>
        </section>
    </main>
    <script src="../scripts/homePageScript.js"></script>
</body>
</html>
