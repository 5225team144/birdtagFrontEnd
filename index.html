<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=devce-width, initial-scale=1.0">
    <title>BirdTag</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header/Navbar-->
    <header>
        <nav class="navbar section-content">
            <a href="#" class="nav-logo">
                <h2 class="logo-text">BirdTag</h2>
            </a>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">About</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">Menu</a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>

            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="section-content">
                <div class="hero-details">
                    <h2 class="title">BirdTag - An AI supported image detector!</h2>
                    <h3 class="subtitle">Explore what birds are there in the media</h3>
                    <p class="description">Welcome and upload the bird media to get started</p>

                    <div class="buttons">
                        <a href="#" class="button upload-image">Upload your media file now</a>
                    </div>

                </div>

               <div class="hero-image-wrapper">
                <img src="images/hero-image.png" alt="BirdTag Hero Image" class="hero-image">
               </div>
            </div>
        </section>
    </main>
</body>
</html>
